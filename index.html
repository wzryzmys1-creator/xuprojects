<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日运势</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 标题区域 -->
        <header class="header">
            <h1>今日运势</h1>
            <p class="subtitle">点击下方按钮，获取今日运势</p>
        </header>

        <!-- 抽签区域 -->
        <main class="fortune-box">
            <!-- 结果展示区域（初始隐藏）- 卡片翻转容器 -->
            <div class="result" id="result">
                <div class="fortune-card" id="fortuneCard">
                    <!-- 卡片正面 - 翻转前显示"占卜中" -->
                    <div class="card-front" id="cardFront">占卜中...</div>

                    <!-- 卡片背面 - 翻转后显示结果 -->
                    <div class="card-back" id="cardBack">
                        <!-- 运势等级 -->
                        <div class="fortune-rank" id="fortuneRank"></div>

                        <!-- 签文 -->
                        <div class="fortune-text" id="fortuneText"></div>

                        <!-- 幸运数字 -->
                        <div class="lucky-number">
                            <span class="label">幸运数字</span>
                            <span class="number" id="luckyNumber"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 按钮区域 -->
            <div class="action-area">
                <button class="draw-btn" id="drawBtn">开始抽签</button>
            </div>
        </main>

        <!-- 底部信息 -->
        <footer class="footer">
            <p>仅供娱乐，仅供参考</p>
        </footer>
    </div>

    <!-- 引入 JS 文件 -->
    <script src="js/fortune.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
